name: CI

# Runs the same checks a contributor runs locally — typecheck, the engine /
# AI / online-action test suite, and a production build — on every PR and on
# pushes to main. Keeping the engine green matters more than usual here: the
# server-authoritative online move path trusts the pure engine, so an engine
# regression is now an integrity regression too.

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch/PR cancels the older, still-running job.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The build is a dynamic Next.js build; the Supabase browser client is
      # created lazily (only in the browser at runtime), so the build doesn't
      # need real credentials. We pass syntactically-valid PUBLIC placeholders
      # so nothing trips if a render path ever touches the client. No secrets.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      # No lint step: this repo has no `lint` script and no ESLint config, so
      # there is nothing to run. Add one here if/when ESLint is configured.
